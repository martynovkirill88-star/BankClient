name: ClientBank
options:
  bundleIdPrefix: ru.martynov
  deploymentTarget:
    iOS: "16.0"
targets:
  ClientBank:
    type: application
    platform: iOS
    sources:
      - path: ClientBankApp.swift
      - path: ContentView.swift
      - path: Theme.swift
      - path: Models.swift
      - path: APIService.swift
      - path: NotificationManager.swift
      - path: BluetoothManager.swift
      - path: PinLockView.swift
      - path: WelcomeView.swift
      - path: DashboardView.swift
      - path: TransferView.swift
      - path: ContactsPickerView.swift
      - path: LiquidGlassAmountView.swift
      - path: BluetoothAtmView.swift
      - path: SettingsView.swift
      - path: StoryViews.swift
      - path: Assets.xcassets
      - path: RoPayLogo.png
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ru.martynov.clientbank
      INFOPLIST_FILE: Info.plist
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "5.0"
      CODE_SIGNING_ALLOWED: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: "RoPay"
      INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Приложение использует Bluetooth для бесконтактного обнаружения банкомата и быстрого входа."
      INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Приложение использует Bluetooth для связи с банкоматом."
      INFOPLIST_KEY_NSFaceIDUsageDescription: "Используется для быстрого и безопасного входа в банк по Face ID."
      INFOPLIST_KEY_NSCameraUsageDescription: "Используется для биометрической верификации лица и Face ID."
      INFOPLIST_KEY_NSContactsUsageDescription: "Приложение использует контакты для быстрого перевода средств клиентам банка RoPay."

  AdminBank:
    type: application
    platform: iOS
    sources:
      - path: Admin
    info:
      path: Admin/AdminInfo.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ru.martynov.ropayadmin
      INFOPLIST_FILE: Admin/AdminInfo.plist
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "5.0"
      CODE_SIGNING_ALLOWED: NO
      INFOPLIST_KEY_CFBundleDisplayName: "RoPay Admin"
      INFOPLIST_KEY_NSCameraUsageDescription: "Используется для съемки фото и видео для публикации статусов банка RoPay."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Используется для выбора фото и видео для публикации статусов банка RoPay."
      INFOPLIST_KEY_NSFaceIDUsageDescription: "Используется для безопасного входа в панель администратора RoPay."

