name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ClientBank iOS IPA
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Backup Info.plist
        run: cp Info.plist Info.plist.orig

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive ClientBank
        run: |
          xcodebuild archive \
            -project ClientBank.xcodeproj \
            -scheme ClientBank \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClientBank.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload to ClientBank.ipa
        run: |
          mkdir -p build/Payload
          cp -r build/ClientBank.xcarchive/Products/Applications/ClientBank.app build/Payload/
          cp Info.plist.orig build/Payload/ClientBank.app/Info.plist
          plutil -replace CFBundleIdentifier -string "ru.martynov.clientbank" build/Payload/ClientBank.app/Info.plist
          plutil -replace CFBundleExecutable -string "ClientBank" build/Payload/ClientBank.app/Info.plist
          plutil -replace CFBundleName -string "RoPay" build/Payload/ClientBank.app/Info.plist
          plutil -replace CFBundleDisplayName -string "RoPay" build/Payload/ClientBank.app/Info.plist
          plutil -replace MinimumOSVersion -string "16.0" build/Payload/ClientBank.app/Info.plist
          plutil -convert xml1 build/Payload/ClientBank.app/Info.plist
          cp AppIcon*.png build/Payload/ClientBank.app/ || true
          cp Icon*.png build/Payload/ClientBank.app/ || true
          cp loader.html build/Payload/ClientBank.app/ || true
          cd build
          zip -r ClientBank.ipa Payload
          rm -rf Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClientBank-IPA
          path: build/ClientBank.ipa
          retention-days: 7

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.23
          name: "RoPay iOS v1.0.23 - Status Video Sound Toggle & Native In-App Browser Zoom Lock"
          body: "RoPay v1.0.23: Автоматическая кнопка включения звука для видео-историй; фикс воспроизведения звука видео в беззвучном режиме; полная блокировка масштабирования и дабл-тапа во встроенном браузере (нативный UI); мгновенный офлайн-вход по ПИН-коду и обновлённая плавная анимация приветствия."
          files: build/ClientBank.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
