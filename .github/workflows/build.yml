name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ClientBank iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project ClientBank.xcodeproj \
            -scheme ClientBank \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClientBank.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ClientBank.xcarchive/Products/Applications/ClientBank.app build/Payload/
          # Ensure complete Info.plist with Bluetooth/FaceID privacy descriptions is injected
          cp Info.plist build/Payload/ClientBank.app/Info.plist
          plutil -replace CFBundleIdentifier -string "ru.martynov.clientbank" build/Payload/ClientBank.app/Info.plist
          plutil -replace CFBundleExecutable -string "ClientBank" build/Payload/ClientBank.app/Info.plist
          plutil -replace CFBundleName -string "ClientBank" build/Payload/ClientBank.app/Info.plist
          plutil -replace CFBundleDisplayName -string "ClientBank" build/Payload/ClientBank.app/Info.plist
          plutil -convert binary1 build/Payload/ClientBank.app/Info.plist
          echo "=== VERIFYING FINAL INFO.PLIST ==="
          plutil -p build/Payload/ClientBank.app/Info.plist
          cd build
          zip -r ClientBank.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClientBank-IPA
          path: build/ClientBank.ipa
          retention-days: 7

      - name: Publish Release (Direct IPA Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.7
          name: "ClientBank iOS v1.0.7 (Direct IPA)"
          body: "Исправление переводов клиентам банка и привязки профиля при входе по Face ID."
          files: build/ClientBank.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
